[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-flow-matching"
version = "0.1.0"
description = "Generate MNIST digits with conditional flow matching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "torchvision>=0.17,<1", "tqdm>=4.66,<5", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mnist-flow-train = "mnist_flow.train:main"
mnist-flow-sample = "mnist_flow.sample:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
